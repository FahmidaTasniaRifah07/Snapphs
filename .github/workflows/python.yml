name: Python CI #continuous integration
on: 
  push: #starting workflow
  pull_request: #checking changes & merging them
jobs: 
    test:
        runs-on: ubuntu-latest #linux based os
    
        steps: 
             - name: Set up Python
               uses: actions/setup-python@v5
               with:
                    python-version: '3.14'

             -  name: Check out repository
                uses: actions/checkout@v4

             -  name: Install dependencies
                run: |
                    python -m pip
                    install --upgrade pip
                    pip install -r 
                    requirements.txt

             -  name: Check Python syntax
                run: python -m 
                     compileall -q . 