name: Birthday Automation

on: 
   schedule:
     - cron: '*/5 * * * *'

jobs:
   birthday:
     runs-on: ubuntu-latest

     steps: 
      - name: Checkout Snapphs
        uses: actions/checkout@v4

      - name: Checkout Snapphs-Data
        uses: actions/checkout@v4
        with: 
           repository: FahmidaTasniaRifah07/Snapphs-Data
           token: $ {{ secrets.DATA_REPO_TOKEN }}
           path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
           python-version: '3.14'

      - name: Install dependencies
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Prepare database
        run: cp data/snapphs.db ./snapphs.db

      - name: Run BithdayBot
        run: python BB_V3.py
        env: 
           GMAIL_ADDRESS: $ {{ secrets.GMAIL_ADDRESS }}
           GMAIL_APP_PASSWORD: $ {{ secrets.GMAIL_APP_PASSWORD }}

      - name: Update database
        run: |
             cp snapphs.db data/snapphs.db
             cd data 
             git config user.name "github-actions[bot]"
             git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
             git add snapphs.db
             if git diff --cached --quiet; then
                   echo "No database changes"
             else
                git commit -m "Update birthday records"
                git push
             fi
            
